<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>
</head>
<body>
    <div class="register">
        <form action="/server" method="get">
            <fieldset>
                <legend>Regsitration Form</legend> <br>
                <label for="name"> Full Name </label>
                <input type="text" id="name"> <br> <br> 

                <label for="Email"> Email Id </label> 
                <input type="email" id="Email"><br> <br>
                 
                <label for="Password"> password </label> 
                <input type="password" id="password"><br> <br>

                <label for="date"> Date of birth </label> 
                <input type="date" id="date"><br> <br>

                <label for="age"> Age </label> 
                <input type="number" id="age"><br> <br>

                
                <label for="Password"> password </label> 
                <input type="password" id="password"><br> <br>

                <label for="gender"> Gender </label> 
                <input type="radio" id="gender" name="gender" checked> Male 
                <input type="radio" id="gender" name="gender"> Female <br> <br>

                <label for="country"> Country </label>
                <select>
                    <option selected> India </option>
                    <option> Assam </option>
                    <option> Pakistan </option>
                    <option> Singapore </option>
                    <option> Japan </option>
                </select> <br> <br>

                <label for="language"> language </label>
               <input type="checkbox" name="language" value="Tamil"> Tamil 
               <input type="checkbox" name="language" value="English"> English
               <input type="checkbox" name="language" value="Hindi"> Hindi 

                


                <input type="submit" value="submit">
            </fieldset>
        </form>
    </div>
</body>
</html>
